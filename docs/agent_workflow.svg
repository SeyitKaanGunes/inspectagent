<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="ah_2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fdb"/></marker><marker id="ah_1d2433" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2433"/></marker><marker id="ah_8a93a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a93a6"/></marker><marker id="ah_c46a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c46a00"/></marker><marker id="ah_ff9900" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9900"/></marker><marker id="ah_0f8a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f8a5f"/></marker><marker id="ah_7a3fd1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a3fd1"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="60" y="70" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="750" fill="#1d2433" text-anchor="start">InspectAgent — perception → decision → action loop</text><text x="60" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6475" text-anchor="start">Every arrow out of &#x27;Decide&#x27; is triggered by an OpenCV 5 measurement; each step is logged with the evidence ids and thresholds that caused it.</text><rect x="70" y="200" width="330" height="150" rx="10" fill="#eef4ff" stroke="#2f6fdb" stroke-width="1.6"/><rect x="70" y="200" width="6" height="150" rx="3" fill="#2f6fdb"/><text x="88" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">1 · Act: capture_image</text><text x="88" y="248" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">view (cx, cy, zoom)</text><text x="88" y="265" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">exposure EV · light mode</text><text x="88" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">autofocus on/off</text><text x="88" y="299" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">→ capture cap_n</text><rect x="520" y="170" width="400" height="230" rx="10" fill="#eef4ff" stroke="#2f6fdb" stroke-width="1.6"/><rect x="520" y="170" width="6" height="230" rx="3" fill="#2f6fdb"/><text x="538" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">2 · Perceive (OpenCV 5)</text><text x="538" y="218" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">assess_quality: sharpness ratio,</text><text x="538" y="235" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">  luma / clipping, noise σ, glare %</text><text x="538" y="252" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">detect_anomalies(fast): register →</text><text x="538" y="269" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">  photometric norm → z-map → regions</text><text x="538" y="286" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">detect_anomalies(deep): cv2.dnn</text><text x="538" y="303" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">  ResNet18 features → kNN distance</text><text x="538" y="320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">inspect_region: zoomed re-capture</text><rect x="1040" y="170" width="400" height="230" rx="10" fill="#f5efff" stroke="#7a3fd1" stroke-width="1.6"/><rect x="1040" y="170" width="6" height="230" rx="3" fill="#7a3fd1"/><text x="1058" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">3 · Decide (planner + policy)</text><text x="1058" y="218" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">fused P(anomalous) with refutation</text><text x="1058" y="235" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">quality issues → corrective capture</text><text x="1058" y="252" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">ambiguous → zoom top candidates</text><text x="1058" y="269" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">registration failed → deep model</text><text x="1058" y="286" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">budget / uncertainty → human</text><text x="1058" y="303" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">policy vets every decision</text><path d="M 400 275.0 L 520 275.0" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah_2f6fdb)"/><rect x="438.5" y="255.0" width="43.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="460.0" y="268.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle">image</text><path d="M 920 285.0 L 1040 275.0" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah_2f6fdb)"/><rect x="915.6" y="260.0" width="128.8" height="18" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="980.0" y="273.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#2f6fdb" text-anchor="middle">measurements + ids</text><path d="M 1240.0 400 L 1240.0 470" stroke="#7a3fd1" stroke-width="2.2" fill="none"/><path d="M 230 470 L 1590 470" stroke="#7a3fd1" stroke-width="2.2" fill="none"/><text x="1252.0" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7a3fd1" text-anchor="start">one tool call per step</text><rect x="70" y="560" width="320" height="140" rx="10" fill="#eef4ff" stroke="#2f6fdb" stroke-width="1.6"/><rect x="70" y="560" width="6" height="140" rx="3" fill="#2f6fdb"/><text x="88" y="586" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">Recapture</text><text x="88" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">glare &gt; 0.4 % → diffuse light, EV +0.75</text><text x="88" y="625" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">blur ratio &lt; 0.55 → autofocus</text><text x="88" y="642" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">dark / bright → EV += suggested Δ</text><path d="M 230.0 470 L 230.0 560" fill="none" stroke="#7a3fd1" stroke-width="1.8" marker-end="url(#ah_7a3fd1)"/><rect x="410" y="560" width="320" height="140" rx="10" fill="#eef4ff" stroke="#2f6fdb" stroke-width="1.6"/><rect x="410" y="560" width="6" height="140" rx="3" fill="#2f6fdb"/><text x="428" y="586" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">Zoom &amp; confirm</text><text x="428" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">inspect_region(top candidates, zoom 3)</text><text x="428" y="625" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">confirmed → measure_defect</text><text x="428" y="642" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">refuted → lower fused probability</text><path d="M 570.0 470 L 570.0 560" fill="none" stroke="#7a3fd1" stroke-width="1.8" marker-end="url(#ah_7a3fd1)"/><rect x="750" y="560" width="320" height="140" rx="10" fill="#f5efff" stroke="#7a3fd1" stroke-width="1.6"/><rect x="750" y="560" width="6" height="140" rx="3" fill="#7a3fd1"/><text x="768" y="586" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">Escalate compute</text><text x="768" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">detect_anomalies(deep) when the fast</text><text x="768" y="625" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">detector is unreliable or ambiguous</text><path d="M 910.0 470 L 910.0 560" fill="none" stroke="#7a3fd1" stroke-width="1.8" marker-end="url(#ah_7a3fd1)"/><rect x="1090" y="560" width="320" height="140" rx="10" fill="#ebf8f2" stroke="#0f8a5f" stroke-width="1.6"/><rect x="1090" y="560" width="6" height="140" rx="3" fill="#0f8a5f"/><text x="1108" y="586" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">Finish</text><text x="1108" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">PASS → route_pass</text><text x="1108" y="625" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">FAIL → route_quarantine</text><text x="1108" y="642" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">(only inside auto thresholds)</text><path d="M 1250.0 470 L 1250.0 560" fill="none" stroke="#7a3fd1" stroke-width="1.8" marker-end="url(#ah_7a3fd1)"/><rect x="1430" y="560" width="320" height="140" rx="10" fill="#ebf8f2" stroke="#0f8a5f" stroke-width="1.6"/><rect x="1430" y="560" width="6" height="140" rx="3" fill="#0f8a5f"/><text x="1448" y="586" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">Ask a human</text><text x="1448" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">request_human_review(evidence)</text><text x="1448" y="625" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">→ hold_for_review ticket in</text><text x="1448" y="642" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">DynamoDB review queue</text><path d="M 1590.0 470 L 1590.0 560" fill="none" stroke="#7a3fd1" stroke-width="1.8" marker-end="url(#ah_7a3fd1)"/><path d="M 70 630.0 L 40 630 L 40 295 L 70 295.0" fill="none" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#ah_2f6fdb)"/><text x="48" y="520" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2f6fdb" text-anchor="start">loop</text><path d="M 470.0 700 L 470.0 740 L 25 740 L 25 380 L 155.0 380 L 155.0 350" fill="none" stroke="#2f6fdb" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah_2f6fdb)"/><text x="250" y="760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2f6fdb" text-anchor="start">zoomed re-capture of a candidate region</text><path d="M 990.0 700 L 990.0 760 L 1080 760 L 1080 430 L 870.0 430 L 870.0 400" fill="none" stroke="#7a3fd1" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah_7a3fd1)"/><text x="860" y="785" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a3fd1" text-anchor="start">deep (cv2.dnn) result</text><rect x="1040" y="820" width="560" height="150" rx="10" fill="#ebf8f2" stroke="#0f8a5f" stroke-width="1.6"/><rect x="1040" y="820" width="6" height="150" rx="3" fill="#0f8a5f"/><text x="1058" y="846" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">Human-in-the-loop (web UI / API)</text><text x="1058" y="868" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">approve_fail → route_scrap</text><text x="1058" y="885" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">override_pass → route_pass (audit-logged)</text><text x="1058" y="902" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">rescan → new inspection with clean preset, traces linked</text><path d="M 1590.0 700 L 1220.0 820" fill="none" stroke="#0f8a5f" stroke-width="1.8" marker-end="url(#ah_0f8a5f)"/><path d="M 1250.0 700 L 1080 820" fill="none" stroke="#0f8a5f" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah_0f8a5f)"/><rect x="70" y="820" width="860" height="150" rx="10" fill="#f4f6fa" stroke="#1d2433" stroke-width="1.6"/><rect x="70" y="820" width="6" height="150" rx="3" fill="#1d2433"/><text x="88" y="846" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1d2433" text-anchor="start">Observability: trace of every step</text><text x="88" y="868" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">{step, tool, args, rationale, evidence ids, observation, latency_ms, sim_time_ms, policy_override}</text><text x="88" y="885" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">→ S3 traces/*.json · CloudWatch JSON lines · shown live in the UI timeline</text><text x="88" y="902" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start">proves which OpenCV output changed which later decision</text><text x="60" y="1050" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6475" text-anchor="start">Guardrails: max 14 steps · 8 captures · 2 deep calls · 5 s simulated cycle time; unknown tools or invalid arguments are rejected by JSON-Schema validation;</text><text x="60" y="1074" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6475" text-anchor="start">a PASS needs reliable evidence and P(anomalous) ≤ 0.15, a FAIL needs ≥ 0.90 — everything else is routed to a person.</text></svg>